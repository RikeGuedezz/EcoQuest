<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel · EcoQuest</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;700;800&display=swap"><link rel="stylesheet" href="css/style.css"></head><body><header id="topo"></header>
<main class="wrap" style="padding:30px 20px"><div id="raiz"><p>Carregando...</p></div></main>
<script type="module">
import { supabase } from './js/supabase.js';
import { exigirLogin, ehAdmin } from './js/auth.js';
import { montarCabecalho, esc } from './js/layout.js';
montarCabecalho();
await exigirLogin();
const raiz = document.getElementById('raiz');
if (await ehAdmin()) {
  const [{ data: perfis }, { data: res }] = await Promise.all([
    supabase.from('profiles').select('id,nome,email,criado_em').order('criado_em', { ascending: false }),
    supabase.from('resultados').select('id,user_id,acertos,total,pontos,percentual,criado_em,profiles(nome,email)').order('criado_em', { ascending: false }),
  ]);
  const r = res || [], p = perfis || [];
  const fez = new Set(r.map(x => x.user_id)).size;
  const media = r.length ? (r.reduce((s, x) => s + Number(x.percentual), 0) / r.length).toFixed(1) : '0';
  const melhor = {}; r.forEach(x => { if (!melhor[x.user_id] || x.pontos > melhor[x.user_id].pontos) melhor[x.user_id] = x; });
  const ranking = Object.values(melhor).sort((a, b) => b.pontos - a.pontos).slice(0, 10);
  const data = d => new Date(d).toLocaleString('pt-BR');
  const tab = (cab, linhas) => `<div class="tabela"><table><thead><tr>${cab.map(c => '<th>' + c + '</th>').join('')}</tr></thead><tbody>${linhas.length ? linhas.join('') : '<tr><td colspan="9">Nada por aqui ainda.</td></tr>'}</tbody></table></div>`;
  raiz.innerHTML = `<h1>Painel administrativo</h1>
    <div class="placar"><div><b>${p.length}</b>cadastrados</div><div><b>${fez}</b>fizeram o quiz</div><div><b>${r.length}</b>tentativas</div><div><b>${media}%</b>média geral</div></div>
    <div class="cartao"><h2>Ranking (10 melhores)</h2>${tab(['#', 'Nome', 'Pontos', 'Aproveitamento'], ranking.map((x, k) => `<tr><td>${k + 1}</td><td>${esc(x.profiles?.nome)}</td><td>${x.pontos}</td><td>${x.percentual}%</td></tr>`))}</div><br>
    <div class="cartao"><h2>Participantes</h2>${tab(['Nome', 'E-mail', 'Tentativas', 'Melhor resultado', 'Cadastro'], p.map(u => { const m = melhor[u.id]; return `<tr><td>${esc(u.nome)}</td><td>${esc(u.email)}</td><td>${r.filter(x => x.user_id === u.id).length}</td><td>${m ? m.percentual + '%' : '-'}</td><td>${data(u.criado_em)}</td></tr>`; }))}</div><br>
    <div class="cartao"><h2>Resultados individuais</h2>${tab(['Nome', 'E-mail', 'Acertos', 'Pontos', '%', 'Data'], r.map(x => `<tr><td>${esc(x.profiles?.nome)}</td><td>${esc(x.profiles?.email)}</td><td>${x.acertos}/${x.total}</td><td>${x.pontos}</td><td>${x.percentual}%</td><td>${data(x.criado_em)}</td></tr>`))}</div>`;
} else {
  raiz.innerHTML = '<div class="cartao"><h1>Acesso restrito</h1><p>Esta área é só para os responsáveis pelo projeto.</p></div>';
}
</script></body></html>
