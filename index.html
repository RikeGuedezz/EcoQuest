<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EcoQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topo"></header>
<section class="hero">
  <div class="wrap">
    <h1>Aprenda sobre o meio ambiente e teste o que sabe</h1>
    <p>O EcoQuest reúne conteúdos sobre oceanos, florestas e vida urbana. Estude no seu ritmo e depois responda ao quiz para ver quanto você aprendeu.</p>
    <a class="btn sol" href="quiz.html">Fazer o quiz</a>
  </div>
</section>
<main class="wrap">
  <div class="grade" id="grade"></div>
</main>
<script type="module">
import { montarCabecalho, esc } from './js/layout.js';
import { cards } from './js/data.js';

await montarCabecalho();

const categorias = {
  oceano: 'OCEANOS',
  mata: 'FLORESTAS',
  urbano: 'MEIO URBANO'
};

document.getElementById('grade').innerHTML = cards.map(c => `
  <a class="cartao card card-link" href="conteudo.html?id=${c.id}" aria-label="Estudar: ${esc(c.titulo)}">
    <div class="arte ${esc(c.tema)}" aria-hidden="true">${c.icone}</div>
    <div class="corpo">
      <span class="categoria categoria-${esc(c.tema)}">${categorias[c.tema] || 'MEIO AMBIENTE'}</span>
      <h3>${esc(c.titulo)}</h3>
      <p>${esc(c.descricao)}</p>
      <span class="card-cta">Estudar aqui <span aria-hidden="true">→</span></span>
    </div>
  </a>`).join('');
</script>
</body>
</html>
