<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conteúdo · EcoQuest</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;700;800&display=swap"><link rel="stylesheet" href="css/style.css"></head><body><header id="topo"></header>
<main class="wrap conteudo">
  <aside class="lateral" aria-label="Seções do conteúdo">
    <button data-s="apresentacao" class="ativa">Apresentação</button>
    <button data-s="video">Vídeo aula</button>
    <button data-s="leitura">Leitura</button>
    <a class="btn contorno" href="index.html" style="text-align:center">Voltar</a>
  </aside>
  <section class="cartao" id="area"></section>
</main>
<script type="module">
import { montarCabecalho } from './js/layout.js';
import { cards } from './js/data.js';
montarCabecalho();
const c = cards.find(x => x.id === Number(new URLSearchParams(location.search).get('id')));
if (!c) location.replace('index.html');
document.title = c.titulo + ' · EcoQuest';
const secoes = {
  apresentacao: () => `<h1>${c.icone} ${c.titulo}</h1><p>${c.apresentacao}</p>
    <a class="btn" href="${c.url}" target="_blank" rel="noopener">Acessar conteúdo completo</a>`,
  video: () => c.videoId
    ? `<h2>Vídeo aula</h2><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${c.videoId}" title="${c.titulo}" loading="lazy" allowfullscreen></iframe></div>`
    : `<h2>Vídeo aula</h2><p>Nenhum vídeo foi escolhido para este tema ainda. Enquanto isso, veja opções no YouTube.</p>
       <a class="btn" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(c.busca)}">Buscar vídeos no YouTube</a>`,
  leitura: () => `<h2>Leitura</h2>${c.leitura.map(p => '<p>' + p + '</p>').join('')}`,
};
const botoes = document.querySelectorAll('.lateral button');
function ir(s) {
  botoes.forEach(b => b.classList.toggle('ativa', b.dataset.s === s));
  document.getElementById('area').innerHTML = secoes[s]();
}
botoes.forEach(b => b.onclick = () => ir(b.dataset.s));
ir('apresentacao');
</script></body></html>
